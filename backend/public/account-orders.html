<section id="account-orders-view" class="account-orders" aria-labelledby="account-orders-title">
  <div class="workspace-orders-heading">
    <div>
      <h1 id="account-orders-title">Đơn hàng của tôi</h1>
      <p>Theo dõi từng đơn hàng và mua lại sản phẩm yêu thích.</p>
    </div>
    <a class="button-link" href="/dang-nhap.html?view=cart" data-workspace-view="cart">Tạo đơn hàng</a>
  </div>
  <section id="orders-account-prompt" class="dashboard-card" hidden>
    <div class="dashboard-card-body">
      <h2>Đăng nhập để xem đơn hàng</h2>
      <a class="button-link" href="/dang-nhap.html?returnTo=%2Fdang-nhap.html%3Fview%3Dorders">Đăng nhập</a>
      <a href="/tra-cuu.html">Tra cứu bằng mã đơn</a>
    </div>
  </section>
  <p id="orders-message" role="status" aria-atomic="true"></p>
  <button id="orders-account-retry" class="button-secondary" type="button" hidden>Kiểm tra lại tài khoản</button>
  <section id="orders-panel" class="workspace-orders-panel dashboard-card" aria-label="Danh sách đơn hàng" hidden>
    <form id="orders-filter-form" class="workspace-orders-filters" role="search" aria-label="Lọc đơn hàng">
      <div class="field">
        <label for="orders-date-from">Từ ngày</label>
        <input id="orders-date-from" type="date" name="dateFrom">
      </div>
      <div class="field">
        <label for="orders-date-to">Đến ngày</label>
        <input id="orders-date-to" type="date" name="dateTo">
      </div>
      <div class="field workspace-orders-search">
        <label for="orders-search">Tìm đơn hàng</label>
        <input id="orders-search" name="q" type="search" maxlength="120" placeholder="Mã đơn hoặc tên sản phẩm" autocomplete="off">
      </div>
      <div class="field">
        <label for="orders-sort">Sắp xếp</label>
        <select id="orders-sort" name="sort">
          <option value="newest">Mới nhất</option>
          <option value="oldest">Cũ nhất</option>
        </select>
      </div>
      <div class="field">
        <label for="orders-status-filter">Trạng thái</label>
        <select id="orders-status-filter" name="status">
          <option value="all">Tất cả trạng thái</option>
          <option value="NEW">Mới nhận</option>
          <option value="CONFIRMED">Đã xác nhận</option>
          <option value="SHIPPING">Đang giao</option>
          <option value="COMPLETED">Hoàn thành</option>
          <option value="CANCELLED">Đã hủy</option>
        </select>
      </div>
      <div class="workspace-orders-filter-actions">
        <button type="submit">Tìm kiếm</button>
        <button id="orders-filter-reset" class="button-secondary" type="button">Xóa bộ lọc</button>
        <button id="orders-reload" class="button-secondary" type="button">Tải lại</button>
      </div>
    </form>
    <div class="workspace-orders-results">
      <p id="orders-summary" role="status" aria-atomic="true"></p>
      <div id="orders-list" aria-busy="false"></div>
      <nav class="orders-pagination" aria-label="Phân trang đơn hàng">
        <button id="orders-previous" class="button-secondary" type="button" disabled>Trang trước</button>
        <span id="orders-page">Trang 1</span>
        <button id="orders-next" class="button-secondary" type="button" disabled>Trang sau</button>
      </nav>
    </div>
  </section>
  <details id="orders-claim-panel" class="dashboard-card workspace-orders-claim" hidden>
    <summary>Thêm đơn hàng đã có mã</summary>
    <div class="dashboard-card-body">
      <p class="field-help">Nhập mã đơn và số điện thoại nhận hàng để liên kết với tài khoản đang đăng nhập.</p>
      <form id="orders-claim-form" method="post" action="/api/account/orders/claim">
        <div class="field">
          <label for="orders-claim-code">Mã đơn hàng</label>
          <input id="orders-claim-code" name="orderId" type="text" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="orders-claim-phone">Số điện thoại nhận hàng</label>
          <input id="orders-claim-phone" name="customerPhone" type="tel" autocomplete="tel" required>
        </div>
        <button id="orders-claim-submit" type="submit" disabled>Thêm vào đơn hàng của tôi</button>
      </form>
      <p id="orders-claim-message" role="status" aria-atomic="true"></p>
    </div>
  </details>
</section>
